# A stack built to be watched rather than used: nine services with different
# temperaments, so composemux has something to show in every column.
#
# Nothing here is stateful. `docker compose down` leaves nothing behind.

name: composemux-demo

# Every hand-written service is the same stock python image with a different
# script mounted in. No build step, no dependencies to install.
x-py: &py
  image: python:3.13-alpine
  working_dir: /app
  environment:
    PYTHONUNBUFFERED: "1"   # unbuffered stdout: a buffered service looks stalled
  volumes:
    - ./services:/app:ro
    - ./state:/state
  stop_grace_period: 3s
  restart: "no"

services:
  # Plain, uncoloured access logs - a contrast to the python services, and a
  # second view of the same request.
  gateway:
    image: nginx:1.29-alpine
    ports:
      - "8099:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
    stop_grace_period: 3s
    restart: "no"

  # The chatty one. Colour-coded access logs, and a health endpoint the activity
  # script can flip to failing.
  api:
    <<: *py
    command: python api.py
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Progress bars and deep stack traces. Scales to several replicas.
  worker:
    <<: *py
    command: python worker.py
    depends_on:
      api:
        condition: service_started

  # Quiet, steady, unicode sparklines. Good second pin.
  metrics:
    <<: *py
    command: python metrics.py

  # Stays up until `./demo crash`, then exits 42.
  flaky:
    <<: *py
    command: python flaky.py

  # Runs once and exits 0 - the cleanly-finished row in the sidebar.
  migrate:
    <<: *py
    command: python migrate.py
    depends_on:
      db:
        condition: service_healthy

  # Real third-party output: initdb runs on every up, because the data
  # directory is a tmpfs and nothing survives a down.
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 5s
    restart: "no"

  # Says almost nothing. Every project has one, and it is the reason a log
  # viewer needs a service list rather than one interleaved stream.
  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3
    stop_grace_period: 3s
    restart: "no"

  # Behind a profile: not started with the rest, so you can bring it up while
  # composemux is already attached and watch the row appear.
  reporter:
    <<: *py
    command: python reporter.py
    profiles: [extra]
