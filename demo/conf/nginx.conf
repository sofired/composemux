# Gateway in front of the api. Every request the activity script makes shows up
# here and again in the api pane - which is what makes pinning two services
# worth doing.

log_format demo '"$request" $status ${body_bytes_sent}b ${request_time}s';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout demo;
    error_log  /dev/stderr warn;

    # Resolved per request rather than at startup, via Docker's embedded DNS, so
    # the gateway comes up even when the api is still starting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
