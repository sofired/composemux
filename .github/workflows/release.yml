name: Release

# Cutting a release is `git tag vX.Y.Z && git push --tags`.
on:
  push:
    tags: ["v*"]

# Default to read-only; jobs opt into more where they need it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Never publish something that doesn't pass its own tests.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Tag must match the version in Cargo.toml
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stem="composemux-${version}-${{ matrix.target }}"
          mkdir -p "dist/$stem"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/composemux.exe" "dist/$stem/"
          else
            cp "target/${{ matrix.target }}/release/composemux" "dist/$stem/"
          fi
          cp README.md LICENSE LICENSE-THIRD-PARTY "dist/$stem/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$stem.zip" "$stem" >/dev/null
            certutil -hashfile "$stem.zip" SHA256 | sed -n 2p > "$stem.zip.sha256"
          else
            tar czf "$stem.tar.gz" "$stem"
            shasum -a 256 "$stem.tar.gz" > "$stem.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: composemux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  github-release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

  crates-io:
    name: publish to crates.io
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Gate on a protected environment so a tag push alone cannot publish.
    environment: release
    permissions:
      # Required for the OIDC exchange; no long-lived token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
