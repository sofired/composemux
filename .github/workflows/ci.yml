name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the repo. Jobs needing more should
# opt in individually rather than widening this.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Pinned to a commit on the action's `master` branch, not to the head of
      # its `stable` branch: upstream requires a full-SHA pin to be inside
      # master's history, because commits outside it are garbage-collected and
      # the workflow then fails to resolve. The only thing `stable` adds on top
      # of master is a default for the `toolchain` input, which every step here
      # passes explicitly, so the two behave identically for us. rustup still
      # resolves `stable` at run time, so this freezes the action's code, not
      # the Rust version.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # The clipboard fallback is optional; make sure it still builds without it.
      - run: cargo build --locked --no-default-features

  release-build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: composemux-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/composemux

  publish-check:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
      - run: cargo publish --locked --dry-run

  coverage:
    name: coverage
    # A separate job, deliberately: a Codecov outage must never
    # block the test/build gates above. This job's own failure is soft (see
    # fail_ci_if_error below) for the same reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      # taiki-e/install-action fetches a prebuilt cargo-llvm-cov binary
      # (verifying its checksum/attestation) instead of compiling it from
      # crates.io, which saves a couple of minutes over `cargo install`. It's
      # maintained by cargo-llvm-cov's own author and is that tool's
      # README-recommended CI install path.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037  # v2.87.32
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info
      # Codecov requires a token to upload to a protected branch (main is
      # protected), even though this public repo's org has tokenless uploads
      # enabled otherwise. Without it the main-branch report is rejected and
      # the README badge stays "unknown". Fork PRs can't read the secret and
      # codecov-action falls back to its tokenless path for them automatically.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
