[package]
name = "composemux"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal UI for Docker Compose logs, with a navigable service list and pinnable output panes"
license = "MIT"
repository = "https://github.com/sofired/composemux"
readme = "README.md"
keywords = ["docker", "compose", "tui", "logs", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
# The demo stack under demo/ exists to record the README demo against.
# It is not part of the library and has no business in the crate tarball.
exclude = ["demo/"]

[dependencies]
ratatui = "0.30.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
# The published crate. Nx pins a same-named, same-versioned personal fork with
# extra methods (raw retention, styled screen dumps), so depending on "the same"
# package by version silently gets you the wrong one. We reimplement what we need
# in src/model/store.rs rather than take a git dep we could not publish against.
vt100 = "0.16.2"
bollard = "0.21.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process"] }
tokio-util = "0.7"
futures = "0.3"
terminal-colorsaurus = "1.0.3"
arboard = { version = "3.6.1", optional = true }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
anyhow = "1.0"
chrono = "0.4"
base64 = "0.23.1"

[features]
default = ["clipboard-fallback"]
# Platform clipboard integration. Optional because it pulls in X11 on Linux and
# the AppKit frameworks on macOS; OSC 52 alone works over SSH and in most
# terminals, so a minimal build can drop it.
clipboard-fallback = ["dep:arboard"]

[profile.release]
lto = true
strip = true

[dev-dependencies]
proptest = "1.11.0"
# Only for `tokio::time::pause`. `src/fallback.rs` rate-limits how often it
# lists containers, and a test for a rate limit either controls the clock or
# sleeps through it.
tokio = { version = "1.53", features = ["test-util"] }
